# Unsigned Global installer for this branch. No tag, GitHub Release,
# code signing, upstream sync, or third-party distribution. A manual button
# is not declared: GitHub only shows one after this file is on the default branch.
name: Windows unsigned artifact

on:
  push:
    branches:
      - cursor/mc-l4-window-and-exe-name-5999
    paths:
      - .github/workflows/windows-artifact.yml
      - .github/actions/package-launcher/**
      - .github/scripts/**
      - pyappify.yml
      - config.py
      - main.py
      - main_debug.py
      - main_web.py
      - src/**
      - requirements.txt
      - pyproject.toml
      - icons/**
      - assets/**
      - i18n/**
      - deploy.txt

permissions:
  contents: read

concurrency:
  group: windows-unsigned-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build unsigned Windows installers
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Vendor ok and pyappify from this checkout
        shell: pwsh
        run: |
          $tag = "pr.$($env:GITHUB_SHA.Substring(0, 12))"
          python -m ok.update.inline_ok_requirements --tag $tag
          if (-not (Test-Path 'ok\__init__.py')) { throw 'ok was not vendored' }
          if (-not (Test-Path 'pyappify\__init__.py')) { throw 'pyappify was not vendored' }
          $config = Get-Content -Raw config.py
          if ($config -notmatch "gui_title.: .MC_L4") { throw 'config.py lost the MC_L4 title' }

      - name: Keep only the Global profile for this artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Global inherits these values from the China profile when both are
          # present. A one-profile file must repeat them or pip and pythonw change.
          @'
          name: "MC_L4"
          uac: true
          icon: "icons/icon.png"
          website: "http://ok-script.com/ok-ww"

          profiles:
            - name: "Global"
              git_url: "https://github.com/sule99999/ok-wuthering-waves.git"
              admin: true
              main_script: "main.py"
              requires_python: "3.12"
              requirements: "requirements.txt"
              use_pythonw: true
              pip_args: "--no-deps"
              show_add_defender: true
          '@ | Set-Content -Encoding utf8 pyappify.yml

      - name: Package from a short directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PyAppify clones this repo under pyappify_dist while setting up a profile.
          # ok_templates filenames are about 180 characters. The default
          # D:\a\ok-wuthering-waves\... checkout makes those paths longer than
          # the legacy Windows limit, and the launcher's git library stops.
          New-Item -ItemType Directory -Force D:\b | Out-Null
          # Robocopy uses 0-7 for success. PowerShell must not treat those as failures.
          $PSNativeCommandUseErrorActionPreference = $false
          & robocopy $env:GITHUB_WORKSPACE D:\b /E /XD .git /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit $LASTEXITCODE" }
          exit 0

      - name: Install NSIS from the GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The release CDN currently returns 504 for this zip. The asset API
          # still serves the same bytes Tauri verifies (SHA1 EF7FF767...).
          $dest = Join-Path $env:LOCALAPPDATA 'tauri\NSIS'
          if (Test-Path (Join-Path $dest 'makensis.exe')) {
            Write-Host "NSIS already present at $dest"
            exit 0
          }
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          $dll = Join-Path $env:RUNNER_TEMP 'nsis_tauri_utils.dll'
          curl.exe -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -o $zip https://api.github.com/repos/tauri-apps/binary-releases/releases/assets/317051073
          curl.exe -fL --retry 5 --retry-all-errors -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -o $dll https://api.github.com/repos/tauri-apps/nsis-tauri-utils/releases/assets/345882097
          $extract = Join-Path $env:RUNNER_TEMP 'nsis-extract'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item -Path (Join-Path $extract 'nsis-3.11\*') -Destination $dest -Recurse -Force
          $dllDir = Join-Path $dest 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force $dllDir | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $dllDir 'nsis_tauri_utils.dll') -Force
          if (-not (Test-Path (Join-Path $dest 'makensis.exe'))) {
            throw "makensis.exe was not extracted to $dest"
          }

      - name: Package installers
        uses: ./.github/actions/package-launcher
        env:
          PACKAGE_ROOT: D:/b
        with:
          build_exe_only: 'false'
          add_version_name: 'false'

      - name: Check packaged files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'D:\b\pyappify_dist'
          Get-ChildItem $dist | ForEach-Object { '{0} {1}' -f $_.Length, $_.Name }
          $global = Get-Item (Join-Path $dist 'MC_L4-win32-Global-setup.exe')
          if (Get-ChildItem $dist -Filter '*-China-setup.exe') {
            throw 'A China installer was built; this artifact is Global only'
          }
          if ($global.Length -lt 80MB) {
            throw "Global installer is $($global.Length) bytes, too small to contain Python and OpenVINO"
          }
          if ($global.Length -gt 550MB) {
            throw "Global installer is $($global.Length) bytes, larger than the upstream-sized budget"
          }
          $extract = Join-Path $env:RUNNER_TEMP 'launcher-zip'
          Expand-Archive (Join-Path $dist 'MC_L4-win32.zip') $extract
          $exe = Get-ChildItem $extract -Recurse -Filter 'MC_L4.exe' | Select-Object -First 1
          if (-not $exe) { throw 'MC_L4.exe was not inside MC_L4-win32.zip' }
          $exe.VersionInfo | Format-List ProductName, FileDescription, OriginalFilename, FileName | Out-String | Write-Host
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is required to verify the installer contents' }
          $listing = & $sevenZip l $global.FullName
          $listing | Select-String -Pattern 'MC_L4.exe|python\\python.exe|python\\pythonw.exe|working\\config.py|working\\ok\\|working\\assets\\' |
            ForEach-Object { $_.Line }
          if ($listing | Select-String -SimpleMatch -Pattern 'ok_templates' -Quiet) {
            throw 'Global installer still contains ok_templates'
          }
          if ($listing | Select-String -SimpleMatch -Pattern 'working\tests\' -Quiet) {
            throw 'Global installer still contains tests'
          }
          if (-not ($listing | Select-String -SimpleMatch -Pattern 'python.exe' -Quiet)) {
            throw 'Global installer does not contain the bundled Python runtime'
          }
          $hasGitHead = ($listing | Select-String -SimpleMatch -Pattern '.git\HEAD' -Quiet) -or
            ($listing | Select-String -SimpleMatch -Pattern '.git/HEAD' -Quiet)
          if (-not $hasGitHead) {
            throw 'Global installer does not contain an openable git repository'
          }

      - name: Upload unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: MC_L4-win32-Global
          path: D:\b\pyappify_dist\MC_L4-win32-Global-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Install and open the Global launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'D:\mcl4smoke'
          $installer = 'D:\b\pyappify_dist\MC_L4-win32-Global-setup.exe'
          cmd /c "`"$installer`" /S /D=$dest"
          $deadline = (Get-Date).AddMinutes(3)
          $installed = Join-Path $dest 'MC_L4.exe'
          while (-not (Test-Path $installed)) {
            if ((Get-Date) -gt $deadline) { throw "Installer did not produce $installed" }
            Start-Sleep -Seconds 2
          }
          $stdout = Join-Path $dest 'stdout.txt'
          $stderr = Join-Path $dest 'stderr.txt'
          $proc = Start-Process -FilePath $installed -WorkingDirectory $dest -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $logDeadline = (Get-Date).AddSeconds(90)
          $log = $null
          do {
            $log = Get-ChildItem -Path $dest -Recurse -Filter 'app*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log -and (Select-String -LiteralPath $log.FullName -Pattern 'First load, checking update' -Quiet)) {
              break
            }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $logDeadline)
          if ($log) { Get-Content -LiteralPath $log.FullName | Write-Host }
          Write-Host "process=$($proc.Id) exited=$($proc.HasExited) exitcode=$($proc.ExitCode)"
          Get-ChildItem -Path $dest -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 80 FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          if (Test-Path $stdout) { Write-Host '--- stdout ---'; Get-Content $stdout | Write-Host }
          if (Test-Path $stderr) { Write-Host '--- stderr ---'; Get-Content $stderr | Write-Host }
          if (-not $log) { throw 'Launcher did not write a startup log' }
          $text = Get-Content -LiteralPath $log.FullName -Raw
          if ($text -match 'not a valid git repository') {
            throw 'Startup still rejects the packaged repository and reclones'
          }
          if ($text -match 'Attempting to clone') {
            throw 'Startup started a full clone instead of opening the packaged repository'
          }
          if ($text -notmatch 'First load, checking update') {
            throw 'Launcher did not finish the startup load'
          }
          if ($text -notmatch 'running with tauri ui') {
            throw 'Launcher did not start the Tauri window'
          }
          $shot = Join-Path $dest 'gui-smoke.png'
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            Write-Host "screenshot=$shot bytes=$((Get-Item $shot).Length)"
          } catch {
            Write-Host "screenshot was not captured: $($_.Exception.Message)"
          }
          Write-Host "process=$($proc.Id) exited=$($proc.HasExited)"
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

      - name: Upload GUI smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: MC_L4-gui-smoke
          path: D:\mcl4smoke\gui-smoke.png
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke-test the launcher without starting the game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP 'launcher-smoke'
          New-Item -ItemType Directory -Force $extract | Out-Null
          Expand-Archive 'D:\b\pyappify_dist\MC_L4-win32.zip' $extract -Force
          $exe = Get-ChildItem $extract -Recurse -Filter 'MC_L4.exe' | Select-Object -First 1
          $response = Join-Path $env:RUNNER_TEMP 'version-list.json'
          $stdout = Join-Path $env:RUNNER_TEMP 'mc-l4-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'mc-l4-stderr.txt'
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList @(
            '--get-version-list', '--response-file', $response
          ) -WorkingDirectory $exe.DirectoryName -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $proc.WaitForExit(90000)) {
            Stop-Process -Id $proc.Id -Force
            throw 'MC_L4.exe did not exit within 90 seconds'
          }
          Write-Host "exit=$($proc.ExitCode)"
          if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
          if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
          if (Test-Path $response) { Get-Content $response | Write-Host }
          if ($proc.ExitCode -ne 0) { throw "MC_L4.exe --get-version-list exited $($proc.ExitCode)" }
